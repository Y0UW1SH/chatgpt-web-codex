version: 2
updates:
  # Keep the SHA-pinned workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Security updates only. Routine version bumps would conflict with upstream's own
  # dependency updates on every sync (docs/upstream-sync.md); audit.yml reports advisories.
  - package-ecosystem: bun
    directories: ["/", "/launcher"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
